name: native fixture writer diagnostic
on:
  push:
    branches: [diagnostic/465-native-fixture-writer]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UOR-Foundation/LexLean
          ref: cc5561203de8fa5594d573904147a306b2b8bbbf
          persist-credentials: false
      - name: Install exact project toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Run the owning writer for the two observed fixture drifts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cc5561203de8fa5594d573904147a306b2b8bbbf
          mkdir -p writer-output crates/conformance/src/bin
          git rev-parse HEAD > writer-output/source-commit.txt
          git rev-parse HEAD^{tree} > writer-output/source-tree.txt
          cat > crates/conformance/src/bin/native-fixture-writer.rs <<'RS'
          //! Run the unchanged fixture owner for the two observed native-output drifts.
          fn main() {
              let root = repo_model::repo_root();
              for name in ["certificate-resource-exhausted", "preservation-drift"] {
                  let dir = root.join("tests/negative").join(name);
                  let dir = camino::Utf8Path::from_path(&dir).expect("UTF-8 path");
                  repo_conformance::fixtures::write(dir).expect("owning fixture writer");
                  repo_conformance::fixtures::check(dir).expect("regenerated fixture matches actual rerun");
                  println!("WROTE AND CHECKED {name}");
              }
          }
          RS
          cargo run --locked -p repo-conformance --bin native-fixture-writer --all-features 2>&1 | tee writer-output/writer.log
          rm crates/conformance/src/bin/native-fixture-writer.rs
          git diff --check
          git diff --binary -- tests/negative > writer-output/generated-fixtures.patch
          git diff --name-only > writer-output/changed-paths.txt
          for fixture in certificate-resource-exhausted preservation-drift; do
            mkdir -p "writer-output/$fixture"
            cp tests/negative/$fixture/expected/* "writer-output/$fixture/"
          done
          printf '%s\n' 'Generated by the unchanged repo_conformance::fixtures::write owning implementation used by cargo xtask check-fixtures --write, selected to the two actual failing fixture directories. Each was checked by an independent fixtures::check run. No custom serialization or manual oracle editing. This is generation evidence, not a replacement for full EX07 or final acceptance.' > writer-output/README.txt
          rustc --version --verbose > writer-output/rust-version.txt
          lean --version > writer-output/lean-version.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-fixture-writer-cc5561203
          path: writer-output/
          if-no-files-found: error
          retention-days: 7
