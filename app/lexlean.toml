spec = "lexlean/project/1"
name = "stitch-recoverable-service"
language = "1.2"
module_prefix = "StitchModel"
source_roots = ["src"]
entrypoints = ["src/Product/Architecture.lex.tex", "src/Product/Brand.lex.tex", "src/Product/Compliance.lex.tex", "src/Product/Design.lex.tex", "src/Product/Experience.lex.tex", "src/Product/Features.lex.tex", "src/Product/Host.lex.tex", "src/Product/Model.lex.tex", "src/Product/Persistence.lex.tex", "src/Product/Quality.lex.tex", "src/Product/Release.lex.tex", "src/Product/Security.lex.tex", "src/Product/Users.lex.tex", "src/Stitch/Authority.lex.tex", "src/Stitch/ChannelFlow.lex.tex", "src/Stitch/Effects.lex.tex", "src/Stitch/Recovery.lex.tex", "src/Stitch/Relay.lex.tex", "src/Stitch/Signaling.lex.tex", "src/Stitch/System.lex.tex", "src/Stitch/VmAdministration.lex.tex", "src/StitchApp.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[[lexicon_source]]
package = "prism.qual"
kind = "path"
path = "language/prism.qual"

[[lexicon_source]]
package = "prism.sec"
kind = "path"
path = "language/prism.sec"

[[lexicon_source]]
package = "stitch.domain"
kind = "path"
path = "language/stitch.domain"

[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 300000
